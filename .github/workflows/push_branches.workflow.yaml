name: Push checks

on:
  push:
    branches:
      - master
      - beta

jobs:
  build-prebuilds:
    name: Build prebuilds
    uses: ./.github/workflows/build_prebuilds.workflow.yaml

  release:
    name: Release process
    needs: build-prebuilds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          scope: '@kuzzleio'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds-artifacts

      - name: Assemble prebuilds directory
        run: |
          mkdir -p prebuilds
          cp -r prebuilds-artifacts/*/* prebuilds/
          rm -rf prebuilds-artifacts
          find prebuilds -type f

      - name: Smoke-test bundled prebuild
        run: |
          node -e "
            const espresso = require('./index.js');
            const result = espresso.minimize(['.i 2','.o 1','00 0','01 1','10 1','11 1','.e']);
            console.log('smoke test result:', result);
            if (!Array.isArray(result) || result.length === 0) process.exit(1);
          "

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GHP }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SEMANTIC_RELEASE_NPM_PUBLISH: "true"
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: pnpm dlx semantic-release
